<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="loom logo">
	<title>loom</title>
	<style>
		:root { --loom-stroke: #1f2328; }
		@media (prefers-color-scheme: dark) {
			:root { --loom-stroke: #e6edf3; }
		}
	</style>
	<g fill="none" stroke="var(--loom-stroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
		<!-- frame: top/bottom beams and side posts -->
		<line x1="16" y1="18" x2="104" y2="18" />
		<line x1="16" y1="102" x2="104" y2="102" />
		<line x1="24" y1="18" x2="24" y2="102" />
		<line x1="96" y1="18" x2="96" y2="102" />

		<!-- warp threads -->
		<line x1="36" y1="22" x2="36" y2="98" />
		<line x1="48" y1="22" x2="48" y2="98" />
		<line x1="60" y1="22" x2="60" y2="98" />
		<line x1="72" y1="22" x2="72" y2="98" />
		<line x1="84" y1="22" x2="84" y2="98" />

		<!-- weft thread, woven through the warp, trailing off toward the shuttle -->
		<path d="M4,60 L24,60 L36,52 L48,68 L60,52 L72,68 L84,52 L96,60 L108,60" />

		<!-- shuttle -->
		<path d="M100,60 C104,57 112,57 118,60 C112,63 104,63 100,60 Z" stroke-width="3.5" />
	</g>
</svg>
